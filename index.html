<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avalon Minecraft Server</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .cloud {
            position: absolute;
            width: 100px;
            height: 50px;
            background: url('../assets/cloud.png') no-repeat center center;
            background-size: cover;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            animation: moveCloud 10s infinite linear;
        }
        .cloud:nth-child(2) {
            animation-delay: 2s;
        }
        .cloud:nth-child(3) {
            animation-delay: 4s;
        }
        @keyframes moveCloud {
            0% {
                left: -100px;
                top: 0;
            }
            100% {
                left: 100%;
                top: 0;
            }
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #333;
        }
        p {
            font-size: 1.1em;
            margin: 10px 0;
            color: #666;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007BFF;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }
        .button:hover {
            background-color: #0056b3;
        }
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('../assets/sky-background.png') no-repeat center center fixed;
            background-size: cover;
            pointer-events: none;
            z-index: -1;
        }
        .background::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background: rgba(255, 255, 255, 0.1);
            filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="cloud"></div>
        <div class="cloud"></div>
        <div class="cloud"></div>
    </div>
    <div class="container">
        <h1>Welcome to Avalon Minecraft Server</h1>
        <p>Join us for epic adventures in the realm of gods and heroes!</p>
        <p>Server Address: play.avalonmc.com</p>
        <p>Current Players: <span id="players">0</span></p>
        <a href="https://play.avalonmc.com" class="button">Join Server</a>
    </div>
    <script>
        // Example script to fetch player count from a server status API
        function fetchPlayerCount() {
            fetch('https://api.avalonmc.com/player-count')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('players').innerText = data.count;
                })
                .catch(error => console.error('Error fetching player count:', error));
        }
        fetchPlayerCount();

        // Moving Clouds with Mouse
        document.addEventListener('mousemove', function(event) {
            const clouds = document.querySelectorAll('.cloud');
            clouds.forEach((cloud, index) => {
                const dx = event.clientX - window.innerWidth / 2;
                const dy = event.clientY - window.innerHeight / 2;
                cloud.style.transform = `translate(${dx / 10}px, ${dy / 10}px)`;
            });
        });
    </script>
</body>
</html>
