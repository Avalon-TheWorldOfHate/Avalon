<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DIVINITY</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>


    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <div class="background">

        <img
            src="../assets/sky-background.png"
            class="sky-background"
            id="skyBackground"
            alt=""
        >

    </div>


    <!-- =========================================
         CLOUD LAYER - BACK
    ========================================== -->

    <div
        class="cloud-layer cloud-layer-back"
        id="cloudLayerBack"
    >

        <img
            src="../assets/cloud.png"
            class="cloud cloud-back cloud-1"
            alt=""
        >

        <img
            src="../assets/cloud.png"
            class="cloud cloud-back cloud-2"
            alt=""
        >

        <img
            src="../assets/cloud.png"
            class="cloud cloud-back cloud-3"
            alt=""
        >

    </div>


    <!-- =========================================
         TOP NAVIGATION
    ========================================== -->

    <header class="top-bar">

        <div class="site-logo">
            DIVINITY
        </div>


        <nav class="tabs">


            <!-- NORMAL TAB -->

            <button
                class="tab-button"
                type="button"
                data-scroll="home"
            >
                HOME
            </button>


            <!-- POPUP TAB 1 -->

            <button
                class="tab-button"
                type="button"
                data-popup="popupOne"
            >
                INFO
            </button>


            <!-- POPUP TAB 2 -->

            <button
                class="tab-button"
                type="button"
                data-popup="popupTwo"
            >
                SERVER
            </button>


            <!-- POPUP TAB 3 -->

            <button
                class="tab-button"
                type="button"
                data-popup="popupThree"
            >
                TIMES
            </button>


            <!-- NORMAL TAB -->

            <button
                class="tab-button"
                type="button"
                data-scroll="bottom"
            >
                MORE
            </button>


        </nav>

    </header>


    <!-- =========================================
         MAIN PAGE
    ========================================== -->

    <main
        class="hero"
        id="home"
    >


        <!-- =====================================
             FUTURE SUN AND GATE AREA

             Later, the sun and heavenly gate
             can be added inside this section.
        ====================================== -->

        <div class="centerpiece">


            <div
                class="future-art"
                id="futureArt"
            >

                <!--

                    FUTURE PIXEL-ART SUN

                    FUTURE PIXEL-ART HEAVENLY GATE

                    These will be added later.

                -->

            </div>


            <!-- REQUIRED SCHOOL SERVER NOTICE -->

            <div class="school-notice">

                *THIS IS A SCHOOL SERVER. THIS IS NOT PUBLIC*

            </div>


        </div>


    </main>


    <!-- =========================================
         CLOUD LAYER - FRONT
    ========================================== -->

    <div
        class="cloud-layer cloud-layer-front"
        id="cloudLayerFront"
    >

        <img
            src="../assets/cloud.png"
            class="cloud cloud-front cloud-4"
            alt=""
        >

        <img
            src="../assets/cloud.png"
            class="cloud cloud-front cloud-5"
            alt=""
        >

        <img
            src="../assets/cloud.png"
            class="cloud cloud-front cloud-6"
            alt=""
        >

    </div>


    <!-- =========================================
         EMPTY LOWER SECTION

         You can add more content later.
    ========================================== -->

    <section
        class="lower-section"
        id="bottom"
    >

        <!-- Add your own content here -->

    </section>


    <!-- =========================================
         POPUP 1
    ========================================== -->

    <div
        class="popup-overlay"
        id="popupOne"
    >

        <div
            class="popup-window"
            role="dialog"
            aria-modal="true"
        >


            <div class="popup-top">

                <div class="popup-title">

                    INFO

                </div>


                <button
                    class="popup-close"
                    type="button"
                    aria-label="Close popup"
                >
                    ×
                </button>

            </div>


            <div class="popup-content">

                <!--
                    WRITE YOUR OWN CONTENT HERE
                -->

            </div>


        </div>

    </div>


    <!-- =========================================
         POPUP 2
    ========================================== -->

    <div
        class="popup-overlay"
        id="popupTwo"
    >

        <div
            class="popup-window"
            role="dialog"
            aria-modal="true"
        >


            <div class="popup-top">

                <div class="popup-title">

                    SERVER

                </div>


                <button
                    class="popup-close"
                    type="button"
                    aria-label="Close popup"
                >
                    ×
                </button>

            </div>


            <div class="popup-content">

                <!--
                    WRITE YOUR OWN CONTENT HERE
                -->

            </div>


        </div>

    </div>


    <!-- =========================================
         POPUP 3
    ========================================== -->

    <div
        class="popup-overlay"
        id="popupThree"
    >

        <div
            class="popup-window"
            role="dialog"
            aria-modal="true"
        >


            <div class="popup-top">

                <div class="popup-title">

                    TIMES

                </div>


                <button
                    class="popup-close"
                    type="button"
                    aria-label="Close popup"
                >
                    ×
                </button>

            </div>


            <div class="popup-content">

                <!--
                    WRITE YOUR OWN CONTENT HERE
                -->

            </div>


        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
