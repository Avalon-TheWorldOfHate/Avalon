<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avalon Minecraft Server</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #333;
        }
        p {
            font-size: 1.1em;
            margin: 10px 0;
            color: #666;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007BFF;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }
        .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Avalon Minecraft Server</h1>
        <p>Join us for epic adventures in the realm of gods and heroes!</p>
        <p>Server Address: play.avalonmc.com</p>
        <p>Current Players: <span id="players">0</span></p>
        <a href="https://play.avalonmc.com" class="button">Join Server</a>
    </div>
    <script>
        // Example script to fetch player count from a server status API
        function fetchPlayerCount() {
            fetch('https://api.avalonmc.com/player-count')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('players').innerText = data.count;
                })
                .catch(error => console.error('Error fetching player count:', error));
        }
        fetchPlayerCount();
    </script>
</body>
</html>
